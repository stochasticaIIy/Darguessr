<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>DarGuessr</title>
<style>
:root{--ink:#132a26;--cream:#f7f4ea;--lime:#dfff74;--orange:#ff725e;--line:#d8d8ce;--muted:#698079}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Kufi Arabic',sans-serif}
.top{height:74px;padding:0 7vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.brand{font:700 22px 'DM Sans'}
.brand:before{content:'◇';display:inline-grid;place-items:center;width:30px;height:30px;margin-left:9px;background:var(--ink);color:var(--lime);border-radius:8px}
.lang button{border:0;background:#fff;padding:7px 12px;border-radius:18px;cursor:pointer}
.lang .on{color:#fff;background:var(--ink)}
.hero{padding:7vw;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.eyebrow{font:600 12px 'DM Sans';letter-spacing:1px;color:var(--muted)}
h1{font-size:clamp(44px,7vw,88px);line-height:1.1;margin:15px 0;letter-spacing:-2px}
p{color:var(--muted);line-height:1.8}
.btn{border:0;border-radius:9px;padding:14px 20px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.hero-card{border:1px solid var(--ink);border-radius:17px;overflow:hidden;background:#fff;box-shadow:9px 9px var(--orange);font-family:'DM Sans'}
.hero-img{height:190px;background:url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=900&q=80') center/cover}
.hero-card div:last-child{padding:19px;font-size:20px;font-weight:700}
.stats{display:flex;gap:60px;padding:22px 7vw;border-block:1px solid var(--line);background:#fff}
.stats b{display:block;font-size:24px}
.stats span{font-size:13px;color:var(--muted)}
.game{padding:68px 7vw 35px}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}
.head h2{margin:0;font-size:37px}
.head p{margin:6px 0}
.progress{direction:ltr;font:13px 'DM Sans';color:var(--muted);text-align:left}
.bar{height:6px;width:125px;background:#ddd;border-radius:6px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--orange);border-radius:6px}
.grid{display:grid;grid-template-columns:7fr 3fr;gap:22px}
.round,.map{border-radius:17px;overflow:hidden}
.round{background:var(--ink);color:#fff}
.gallery,.reveal{height:380px;position:relative;overflow:hidden}
.track{height:100%;display:flex;direction:ltr;transition:.35s}
.slide{min-width:100%;background:center/cover}
.arrow{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:#fff;font-size:23px;cursor:pointer}
.prev{right:16px}
.next{left:16px}
.count{position:absolute;left:15px;bottom:14px;padding:5px 8px;border-radius:15px;background:#000a;font:12px 'DM Sans'}
.details{padding:25px}
.details h3{font-size:28px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}
.chip{border:1px solid #55736b;border-radius:7px;padding:6px 9px;font-size:12px}
.input{padding-top:20px;border-top:1px solid #49625c;display:flex;gap:9px}
.input input,.name-input{border:0;border-radius:8px;padding:13px;font:700 14px 'DM Sans';width:210px}
.guess{background:var(--lime);color:var(--ink)}
.map{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
.map-head{padding:21px;border-bottom:1px solid var(--line)}
.map-head h3{margin:0;font-size:20px}
.map-head p{font-size:12px;margin:5px 0}
.map-body{position:relative;flex:1;min-height:530px}
.map-body #map{width:100%;height:100%;background:var(--cream)}
.leaflet-control-zoom{display:none!important}

/* Zoom Control Styles */
.zoom{position:absolute;z-index:1000;top:12px;right:12px;left:auto;display:grid;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.zoom button{width:40px;height:40px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.zoom button:last-child{border-bottom:0}
.zoom button:hover{background:rgba(0,0,0,.08)}

.reveal{display:none;align-items:center;justify-content:center;text-align:center;background:#286e52;padding:25px}
.reveal.yellow{background:#a66f00}
.reveal.red{background:#a64141}
.reveal h3{font:700 62px 'DM Sans';margin:9px}
.reveal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.reveal-stat{border:1px solid #ffffff70;border-radius:8px;padding:12px}
.reveal-stat b{display:block;font:700 18px 'DM Sans'}
.reveal-stat small{font-size:11px}
.next-btn{background:#fff;color:var(--ink)}
.final{display:none;padding:38px;text-align:center}
.final h3{font-size:42px;margin:7px}
.score{font:700 55px 'DM Sans'}
.rank{display:inline-block;margin:12px;padding:8px 11px;border-radius:7px;background:var(--lime);color:var(--ink);font-size:13px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0;text-align:right}
.links a{background:#eef3eb;color:var(--ink);padding:10px;border-radius:7px;text-decoration:none;font-size:12px}
.add-name{margin:18px 0;display:flex;justify-content:center;gap:8px}
.add-name input{border:1px solid var(--line)}
.leaders{max-width:900px;margin:40px auto}
.leaders h3{text-align:center}
.leader-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

/* Leader Styles & BIDI Fix */
.leader{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;display:flex;gap:8px;align-items:center;font-family:'DM Sans'}
.leader b{margin-right:auto;margin-left:0}
.leader-name{direction:ltr;unicode-bidi:isolate;display:inline-block}

.footer{padding:25px 7vw;color:var(--muted);font:13px 'DM Sans'}
body.en{font-family:'DM Sans',sans-serif;direction:ltr}
.en .hero,.en .head,.en .top{direction:ltr}
.en .prev{left:16px;right:auto}
.en .next{right:16px;left:auto}
.en .count{right:15px;left:auto}
.en .zoom{left:12px;right:auto}
.en .links{text-align:left}
.en .leader b{margin-left:auto;margin-right:0}
@media(max-width:800px){.hero,.grid{grid-template-columns:1fr}.hero{padding:50px 20px}.game{padding:50px 20px}.top{padding:0 20px}.stats{gap:25px}.map-body{min-height:350px}.gallery,.reveal{height:300px}.leader-grid,.links{grid-template-columns:1fr}.reveal-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">DarGuessr</div>
  <div class="lang">
    <button id="arBtn" class="on" onclick="setLang('ar')">ع</button>
    <button id="enBtn" onclick="setLang('en')">EN</button>
  </div>
</header>
<main>
  <section class="hero">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p id="intro"></p>
      <a href="#play"><button class="btn" id="start"></button></a>
    </div>
    <div class="hero-card">
      <div class="hero-img"></div>
      <div>
        <span id='heroInfo'>2-bed | Gauthier</span><br>
        <small id='heroPrice'>???? MAD / month</small>
      </div>
    </div>
  </section>
  <section class="stats">
    <div><b>5</b><span id="city"></span></div>
    <div><b>6,500+</b><span id="listing"></span></div>
    <div><b id="seconds"></b><span id="perRound"></span></div>
  </section>
  <section class="game" id="play">
    <div class="head">
      <div>
        <h2 id="gameTitle"></h2>
        <p id="gameSub"></p>
      </div>
      <div class="progress" id="progress">01 / 05<div class="bar"><i id="bar"></i></div></div>
    </div>
    <div class="grid">
      <div class="round">
        <div class="gallery" id="gallery">
          <div class="track" id="track">
            <div class="slide"></div>
            <div class="slide"></div>
            <div class="slide"></div>
          </div>
          <button class="arrow prev" onclick="move(-1)">‹</button>
          <button class="arrow next" onclick="move(1)">›</button>
          <span class="count" id="count">1 / 3</span>
        </div>
        <div class="reveal" id="reveal">
          <div>
            <small id="feedback"></small>
            <h3 id="accuracy"></h3>
            <div class="reveal-grid">
              <div class="reveal-stat"><b id="yourGuess"></b><small id="yourLabel"></small></div>
              <div class="reveal-stat"><b id="actual"></b><small id="actualLabel"></small></div>
              <div class="reveal-stat"><b id="points"></b><small id="pointsLabel"></small></div>
            </div>
            <button class="btn next-btn" id="nextBtn" onclick="nextRound()"></button>
          </div>
        </div>
        <div class="final" id="final">
          <div class="eyebrow" id="complete"></div>
          <h3 id="scoreTitle"></h3>
          <div class="score" id="score"></div>
          <div class="rank" id="playerRank"></div>
          <div class="links" id="links"></div>
          <div class="add-name">
            <input class="name-input" id="playerName">
            <button class="btn" id="addButton" onclick="addPlayer()"></button>
          </div>
          <button class="btn" id="again" onclick="restart()"></button>
        </div>
        <div class="details" id="details">
          <div class="eyebrow" id="roundTitle"></div>
          <h3 id="location"></h3>
          <p id="description"></p>
          <div class="chips" id="chips"></div>
          <div class="input">
            <input id="guess" type="number">
            <button class="btn guess" id="guessBtn" onclick="submit()"></button>
          </div>
        </div>
      </div>
      <aside class="map">
        <div class="map-head">
          <h3 id="mapTitle"></h3>
          <p id="mapSub"></p>
        </div>
        <div class="map-body">
          <div id="map"></div>
          <div class="zoom">
            <button onclick="zoom(1)">+</button>
            <button onclick="zoom(-1)">−</button>
          </div>
        </div>
      </aside>
    </div>
    <div class="leaders">
      <h3 id="leadersTitle"></h3>
      <div class="leader-grid" id="leaderGrid"></div>
      <div style="text-align:center;margin-top:16px">
        <button class="btn" id="exportBtn" onclick="exportLeadersTxt()" style="background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 14px;font-size:12px"></button>
      </div>
    </div>
  </section>
</main>
<footer class="footer">© 2026 DarGuessr</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ==========================================
// GLOBAL LEADERBOARD CONFIGURATION (JSONBin.io)
// ==========================================
// Replace these with your Bin ID and Master Key from jsonbin.io for live cross-device syncing.
// If left as placeholders, the game automatically falls back to local browser storage.
const BIN_ID = '6a724dd4da38895dfeba1777';
const API_KEY = '$2a$10$3xI2W00BsiGhjbq2yCC4jeq6sj7TqNA3I1lGa2AAfthmUjM5M.r7q';

const T={
  ar:{e:'تحدي إيجار العقارات بالمغرب',t:'هل تستطيع تخمين الإيجار؟',i:'شاهد الشقة، وخمّن إيجارها الشهري بالدرهم.',s:'ابدأ التخمين',c:'مدن للاستكشاف',l:'مرجع إعلان',sec:'60 ثانية',pr:'لكل جولة',gt:'تحدي من خمس جولات',gs:'لا تحتاج إلى حساب - جرّب أفضل تخمين لديك.',mt:'استكشف الحي',ms:'استخدم أزرار + و − فقط.',ld:'متصدرو هذا الأسبوع',g:'أدخل تخمينك بالدرهم',lk:'أكّد التخمين',n:'الجولة التالية',yg:'تخمينك',ac:'الإيجار الحقيقي',pt:'النقاط المكتسبة',co:'اكتمل التحدي',st:'نتيجتك في تخمين الإيجار',rk:'ترتيبك هذا الأسبوع',so:'عرض الإعلان الأصلي',nm:'ادخل اسمك',ad:'أضفني إلى الترتيب',ag:'العب مجدداً',gr:'تخمين رائع!',gd:'تخمين جيد!',kp:'حاول في الجولة التالية!',exp:'تحميل الترتيب (.txt)'},
  en:{e:'THE MOROCCO RENT CHALLENGE',t:'Can you guess the rent?',i:'See a rental, estimate its monthly price in dirhams, and find out how close you are.',s:'Start guessing',c:'cities to explore',l:'listing references',sec:'60 sec',pr:'per round',gt:'Your five-round challenge',gs:'No account needed - take your best shot.',mt:'Explore the neighborhood',ms:'Use the + and − buttons only.',ld:"This week's leaders",g:'Your guess in MAD',lk:'Lock in my guess',n:'Next round',yg:'Your guess',ac:'Actual rent',pt:'Points won',co:'CHALLENGE COMPLETE',st:'Your Morocco rent score',rk:'Your weekly rank',so:'View the original listing',nm:'Enter your name',ad:'Add me to rankings',ag:'Play again',gr:'Excellent eye!',gd:'Good guess!',kp:'Keep going!',exp:'Export Rankings (.txt)'}
};

const homes=[
  ['Oasis, Casablanca','أوازيس، الدار البيضاء',8000,-7.638,33.572,'ca204372'],
  ['Les Princesses, Casablanca','لي برانسيس، الدار البيضاء',7500,-7.630,33.573,'ca204527'],
  ['Essaada, Marrakech','السعادة، مراكش',7500,-8.034,31.657,'ma203029'],
  ['Mers Sultan, Casablanca','ميرس سلطان، الدار البيضاء',9800,-7.609,33.572,'ca204262'],
  ['Riyad, Rabat','الرياض، الرباط',22000,-6.852,33.968,'ra197815']
];
const paths=['louer-appartement-casablanca-oasis-','louer-appartement-casablanca-les-princesses-','louer-appartement-marrakech-essaada-','louer-appartement-casablanca-mers-sultan-','louer-appartement-rabat-riyad-'];
const pics=[['1600607687939-ce8a6c25118c','1600566753086-00f18fb6b3ea','1600585154340-be6161a56a0c'],['1618221195710-dd6b41faaea6','1600607687920-4e2a09cf159d','1600210492486-724fe5c67fb0'],['1600047509807-ba8f99d2cdde','1600607688969-a5bfcd646154','1600573472591-ee6b68d14c68'],['1600607687644-c7171b42498f','1617104678098-de229db51175','1613490493576-7fde63acd811'],['1600210491892-03d54c0aaf87','1600585154526-990dced4db0d','1600607688066-890987f18a86']];

let L='ar',r=0,score=0,p=0,z=0,mapInst=null,marker=null,cachedLeaders=[];
const $=x=>document.getElementById(x),t=()=>T[L],fmt=n=>n.toLocaleString(L==='ar'?'ar-MA':'en-US');

const DEFAULT_LEADERS = [['Yasmine K.', 4820], ['Amine R.', 4570], ['Sara B.', 4225]];

// Async Leaderboard Functions (Supports Cloud API + Local Backup)
async function getLeaders() {
  if (BIN_ID !== 'YOUR_BIN_ID_HERE' && API_KEY !== 'YOUR_MASTER_KEY_HERE') {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': API_KEY }
      });
      if (res.ok) {
        const data = await res.json();
        cachedLeaders = data.record;
        return cachedLeaders;
      }
    } catch (e) {
      console.warn('JSONBin fetch failed, falling back to local data:', e);
    }
  }
  
  try {
    const saved = localStorage.getItem('darguessr_leaders');
    cachedLeaders = saved ? JSON.parse(saved) : DEFAULT_LEADERS;
  } catch (e) {
    cachedLeaders = DEFAULT_LEADERS;
  }
  return cachedLeaders;
}

async function saveLeaders(leaders) {
  cachedLeaders = leaders;
  try {
    localStorage.setItem('darguessr_leaders', JSON.stringify(leaders));
  } catch (e) {}

  if (BIN_ID !== 'YOUR_BIN_ID_HERE' && API_KEY !== 'YOUR_MASTER_KEY_HERE') {
    try {
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': API_KEY
        },
        body: JSON.stringify(leaders)
      });
    } catch (e) {
      console.error('Failed to sync to JSONBin:', e);
    }
  }
}

async function updateLeaderboardUI() {
  const list = await getLeaders();
  $('leaderGrid').innerHTML = list.map((x, i) => 
    `<div class="leader">${String(i + 1).padStart(2, '0')} · <span class="leader-name" dir="ltr">${x[0]}</span> <b>${fmt(x[1])}</b></div>`
  ).join('');
}

function exportLeadersTxt() {
  const list = cachedLeaders.length ? cachedLeaders : DEFAULT_LEADERS;
  const textContent = list.map((x, i) => `${String(i + 1).padStart(2, '0')}. ${x[0]} - ${x[1]} pts`).join('\r\n');
  const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'darguessr_rankings.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function addPlayer() {
  const n = $('playerName').value.trim();
  if (!n) return $('playerName').focus();
  
  $('playerName').disabled = true;
  $('addButton').disabled = true;

  let list = await getLeaders();
  list.push([n, score]);
  list.sort((a, b) => b[1] - a[1]);
  list = list.slice(0, 10);
  
  await saveLeaders(list);
  await updateLeaderboardUI();
}

function placeMap(h) {
  if (!mapInst) {
    mapInst = window.L.map('map', { zoomControl: false, attributionControl: true }).setView([h[4], h[3]], 14);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(mapInst);
    marker = window.L.circleMarker([h[4], h[3]], { radius: 9, weight: 3, color: '#fff', fillColor: '#ff725e', fillOpacity: 1 }).addTo(mapInst);
  } else {
    mapInst.setView([h[4], h[3]], 14);
    marker.setLatLng([h[4], h[3]]);
  }
}

function zoom(n) {
  z = Math.max(-3, Math.min(5, z + n));
  if (mapInst) mapInst.setZoom(14 + z);
}

function move(n) {
  p = (p + n + 3) % 3;
  $('track').style.transform = `translateX(-${p * 100}%)`;
  $('count').textContent = `${p + 1} / 3`;
}

function render() {
  const h = homes[r];
  $('gallery').style.display = 'block';
  $('reveal').style.display = 'none';
  $('final').style.display = 'none';
  $('details').style.display = 'block';
  $('location').textContent = L === 'ar' ? h[1] : h[0];
  $('description').textContent = L === 'ar' ? `شقة ممثلة في ${h[1]}. استكشف الحي على الخريطة قبل التخمين.` : `A representative apartment in ${h[0]}. Explore the neighborhood before guessing.`;
  $('chips').innerHTML = (L === 'ar' ? ['شقة', 'إيجار شهري', 'درهم'] : ['Apartment', 'Monthly rent', 'MAD']).map(x => `<span class="chip">${x}</span>`).join('');
  document.querySelectorAll('.slide').forEach((e, i) => e.style.backgroundImage = `url(https://images.unsplash.com/photo-${pics[r][i]}?auto=format&fit=crop&w=1400&q=85)`);
  z = 0;
  placeMap(h);
  $('guess').value = '';
  $('guess').placeholder = t().g;
  p = 0;
  move(0);
  $('progress').childNodes[0].nodeValue = `${r + 1} / 05`;
  $('bar').style.width = `${(r + 1) * 20}%`;
}

function submit() {
  const g = +$('guess').value;
  if (!g) return $('guess').focus();
  const a = homes[r][2], pt = Math.max(0, Math.round(100 - Math.abs(g - a) / a * 100));
  score += pt;
  $('gallery').style.display = 'none';
  $('reveal').style.display = 'flex';
  $('reveal').className = 'reveal ' + (pt >= 85 ? '' : pt >= 55 ? 'yellow' : 'red');
  $('feedback').textContent = pt >= 85 ? t().gr : pt >= 55 ? t().gd : t().kp;
  $('accuracy').textContent = fmt(pt) + '%';
  $('yourGuess').textContent = fmt(g) + ' ' + (L === 'ar' ? 'درهم' : 'MAD');
  $('actual').textContent = fmt(a) + ' ' + (L === 'ar' ? 'درهم' : 'MAD');
  $('points').textContent = '+' + fmt(pt);
  $('nextBtn').textContent = r === 4 ? (L === 'ar' ? 'عرض النتائج' : 'See results') : t().n;
}

function nextRound() {
  if (++r < 5) return render();
  $('reveal').style.display = 'none';
  $('details').style.display = 'none';
  $('final').style.display = 'block';
  $('score').textContent = fmt(score) + ' / 500';
  $('playerRank').textContent = t().rk + ': ' + (score >= 425 ? 'Top 2%' : score >= 300 ? 'Top 12%' : 'Top 35%');
  $('links').innerHTML = homes.map((h, i) => `<a href="https://yakeey.com/fr-ma/${paths[i]}${h[5]}" target="_blank">${L === 'ar' ? h[1] : h[0]} — ${t().so}</a>`).join('');
  $('playerName').placeholder = t().nm;
  $('addButton').textContent = t().ad;
}

function restart() {
  r = 0;
  score = 0;
  $('playerName').value = '';
  $('playerName').disabled = false;
  $('addButton').disabled = false;
  render();
}

function setLang(n) {
  L = n;
  document.documentElement.lang = n;
  document.body.dir = n === 'ar' ? 'rtl' : 'ltr';
