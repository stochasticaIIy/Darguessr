<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<title>DarGuessr</title>
<style>
:root{--ink:#132a26;--cream:#f7f4ea;--lime:#dfff74;--orange:#ff725e;--line:#d8d8ce;--muted:#698079}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Kufi Arabic',sans-serif;transition:background .3s,color .3s}
.top{height:74px;padding:0 7vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.brand{font:700 22px 'DM Sans'}
.brand:before{content:'◇';display:inline-grid;place-items:center;width:30px;height:30px;margin-left:9px;background:var(--ink);color:var(--lime);border-radius:8px}
.lang{display:flex;gap:6px;align-items:center}
.lang button{border:0;background:#fff;padding:7px 12px;border-radius:18px;cursor:pointer;font-family:inherit}
.lang .on{color:#fff;background:var(--ink)}
.hero{padding:7vw;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.eyebrow{font:600 12px 'DM Sans';letter-spacing:1px;color:var(--muted)}
h1{font-size:clamp(44px,7vw,88px);line-height:1.1;margin:15px 0;letter-spacing:-2px}
p{color:var(--muted);line-height:1.8}
.btn{border:0;border-radius:9px;padding:14px 20px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.hero-card{border:1px solid var(--ink);border-radius:17px;overflow:hidden;background:#fff;box-shadow:9px 9px var(--orange)}
.hero-img{height:190px;background:url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=900&q=80') center/cover}
.hero-card div:last-child{padding:19px;font-size:18px;font-weight:700}
.stats{display:flex;gap:60px;padding:22px 7vw;border-block:1px solid var(--line);background:#fff}
.stats b{display:block;font-size:24px}
.stats span{font-size:13px;color:var(--muted)}
.game{padding:68px 7vw 35px}

/* CITY SELECTOR */
.city-select-wrap{margin-bottom:20px}
.city-select{background:#fff;border:1px solid var(--line);border-radius:20px;padding:9px 16px;font:600 13px 'DM Sans';cursor:pointer;color:var(--ink);outline:none;transition:border-color .2s;min-width:240px}
.city-select:hover{border-color:var(--ink)}
.city-select:focus{border-color:var(--orange)}

.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}
.head h2{margin:0;font-size:37px}
.head p{margin:6px 0}
.progress{direction:ltr;font:13px 'DM Sans';color:var(--muted);text-align:left}
.bar{height:6px;width:125px;background:#ddd;border-radius:6px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--orange);border-radius:6px}
.grid{display:grid;grid-template-columns:7fr 3fr;gap:22px}
.round,.map{border-radius:17px;overflow:hidden}
.round{background:var(--ink);color:#fff;display:flex;flex-direction:column}

/* GALLERY & REVEAL WITH CONTAIN BACKGROUND & ZOOM/PAN SUPPORT */
.gallery{height:65vh;min-height:500px;position:relative;overflow:hidden;width:100%;background:#0b1715}
.reveal{height:65vh;min-height:500px;position:relative;display:none;align-items:center;justify-content:center;text-align:center;background:#286e52;padding:25px;width:100%}

.track{height:100%;display:flex;direction:ltr;transition:.35s}
.slide{min-width:100%;height:100%;position:relative;overflow:hidden;background-color:#0b1715}
.slide-inner{width:100%;height:100%;background-size:contain;background-position:center;background-repeat:no-repeat;transform-origin:center;will-change:transform}

.arrow{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:#fff;font-size:23px;cursor:pointer}
.prev{left:16px;right:auto}
.next{right:16px;left:auto}
.count{position:absolute;left:15px;bottom:14px;padding:5px 8px;border-radius:15px;background:#000a;font:12px 'DM Sans';z-index:3}

/* PHOTO ZOOM & MAP ZOOM CONTROLS */
.zoom{position:absolute;z-index:1000;top:12px;right:12px;left:auto;display:grid;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.photo-zoom{position:absolute;z-index:3;top:12px;left:12px;right:auto;display:grid;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.zoom button, .photo-zoom button{width:40px;height:40px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.zoom button:last-child, .photo-zoom button:last-child{border-bottom:0}
.zoom button:hover, .photo-zoom button:hover{background:rgba(0,0,0,.08)}

/* FULLSCREEN MODAL */
.fs-modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}
.fs-modal img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.fs-close{position:absolute;top:20px;left:20px;background:#fff;border:0;border-radius:50%;width:45px;height:45px;font-size:24px;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:3001}
.fs-arrow{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border:0;border-radius:50%;background:#fff;font-size:28px;cursor:pointer;z-index:3001;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.fs-prev{left:25px;right:auto}
.fs-next{right:25px;left:auto}
.fs-count{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:15px;background:#000a;font:14px 'DM Sans';color:#fff;z-index:3001}

/* SEAMLESSLY INTEGRATED TEXT DETAILS SECTION BELOW */
.details{padding:22px;width:100%;background:var(--ink);border-top:1px solid #49625c}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
.chip{border:1px solid #55736b;border-radius:7px;padding:5px 8px;font-size:12px}
.input{padding-top:14px;border-top:1px solid #49625c;display:flex;gap:9px}
.input input,.name-input{border:0;border-radius:8px;padding:13px;font:700 14px 'DM Sans';width:210px}
.guess{background:var(--lime);color:var(--ink)}
.map{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
.map-head{padding:21px;border-bottom:1px solid var(--line)}
.map-head h3{margin:0;font-size:20px}
.map-head p{font-size:12px;margin:5px 0}
.map-body{position:relative;flex:1;min-height:530px}
.map-body #map{width:100%;height:100%;background:var(--cream)}
.leaflet-control-zoom{display:none!important}
.reveal.yellow{background:#a66f00}
.reveal.red{background:#a64141}
.reveal h3{font:700 52px 'DM Sans';margin:9px}
.reveal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.reveal-stat{border:1px solid #ffffff70;border-radius:8px;padding:10px}
.reveal-stat b{display:block;font:700 16px 'DM Sans'}
.reveal-stat small{font-size:11px}
.next-btn{background:#fff;color:var(--ink)}
.final{display:none;padding:38px;text-align:center}
.final h3{font-size:42px;margin:7px}
.score{font:700 55px 'DM Sans'}
.rank{display:inline-block;margin:12px;padding:8px 11px;border-radius:7px;background:var(--lime);color:var(--ink);font-size:13px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0;text-align:right}
.links a{background:#eef3eb;color:var(--ink);padding:10px;border-radius:7px;text-decoration:none;font-size:12px}
.add-name{margin:18px 0;display:flex;justify-content:center;gap:8px}
.add-name input{border:1px solid var(--line)}
.leaders{max-width:900px;margin:40px auto}
.leaders h3{text-align:center}
.leader-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.leader{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;display:flex;gap:8px;align-items:center;font-family:'DM Sans'}
.leader b{margin-right:auto;margin-left:0}
.leader-name{direction:ltr;unicode-bidi:isolate;display:inline-block}
.footer{padding:25px 7vw;color:var(--muted);font:13px 'DM Sans'}

/* DARK MODE OVERRIDES */
body.dark{--ink:#f7f4ea;--cream:#0d1513;--lime:#dfff74;--orange:#ff725e;--line:#223531;--muted:#9aa8a4}
body.dark .top, body.dark .stats, body.dark .hero-card, body.dark .city-select, body.dark .map, body.dark .leader{background:#13201d;color:var(--ink);border-color:var(--line)}
body.dark .round{background:#13201d;color:var(--ink);border-color:var(--line)}
body.dark .details{background:#13201d;border-top:1px solid var(--line)}
body.dark .chip{border-color:var(--line);background:#1b2d29;color:var(--ink)}
body.dark .btn{background:var(--lime);color:#132a26}
body.dark .btn.guess{background:var(--lime);color:#132a26}
body.dark .next-btn{background:#f7f4ea;color:#132a26}
body.dark .brand:before{background:var(--lime);color:#132a26}
body.dark .lang button{background:#1b2d29;color:var(--ink)}
body.dark .lang .on{background:var(--lime);color:var(--ink)}
body.dark .map-body #map{background:#0d1513}
body.dark .zoom, body.dark .photo-zoom{background:rgba(19, 32, 29, 0.85);border-color:var(--line)}
body.dark .zoom button, body.dark .photo-zoom button{color:var(--ink);border-color:var(--line)}
body.dark .zoom button:hover, body.dark .photo-zoom button:hover{background:rgba(255, 255, 255, 0.08)}
body.dark .links a{background:#1b2d29;color:var(--ink)}
body.dark .input input, body.dark .name-input{background:#13201d;color:var(--ink);border:1px solid var(--line)}

body.en{font-family:'DM Sans',sans-serif;direction:ltr}
.en .hero,.en .head,.en .top{direction:ltr}
.en .links{text-align:left}
.en .leader b{margin-left:auto;margin-right:0}
.en .fs-close{left:auto;right:20px}
@media(max-width:800px){.hero,.grid{grid-template-columns:1fr}.hero{padding:50px 20px}.game{padding:50px 20px}.top{padding:0 20px}.stats{gap:25px}.map-body{min-height:350px}.gallery,.reveal{height:420px}.leader-grid,.links{grid-template-columns:1fr}.reveal-grid{grid-template-columns:1fr}}

<body>
<header class="top">
  <div class="brand">DarGuessr</div>
  <div class="lang">
    <button id="arBtn" class="on" onclick="setLang('ar')">ع</button>
    <button id="enBtn" onclick="setLang('en')">EN</button>
    <button id="darkModeBtn" onclick="toggleDarkMode()">🌙</button>
  </div>
</header>
<main>
  <section class="hero">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p id="intro"></p>
      <a href="#play"><button class="btn" id="start"></button></a>
    </div>
    <div class="hero-card">
      <div class="hero-img"></div>
      <div>
        <span id='heroInfo'></span><br>
        <small id='heroPrice'></small>
      </div>
    </div>
  </section>
  <section class="stats">
    <div><b>10</b><span id="city"></span></div>
    <div><b id="listingCountDisplay">0</b><span id="listing"></span></div>
    <div><b id="seconds">50:00</b><span id="perRound"></span></div>
  </section>
  <section class="game" id="play">
    <div class="city-select-wrap">
      <select id="citySelect" class="city-select" onchange="setCityFilter(this.value)">
        <option value="all">كل المدن / All Cities</option>
        <option value="Casablanca">الدار البيضاء / Casablanca</option>
        <option value="Rabat">الرباط / Rabat</option>
        <option value="Marrakech">مراكش / Marrakech</option>
        <option value="Tanger">طنجة / Tanger</option>
        <option value="Agadir">أكادير / Agadir</option>
        <option value="Fès">فاس / Fès</option>
        <option value="Salé">سلا / Salé</option>
        <option value="Oujda">وجدة / Oujda</option>
        <option value="Kénitra">القنيطرة / Kénitra</option>
        <option value="Laâyoune">العيون / Laâyoune</option>
        <option value="Dakhla">الداخلة / Dakhla</option>
        <option value="Meknès">مكناس / Meknès</option>
        <option value="Bouskoura">بوسكورة / Bouskoura</option>
        <option value="Berkane">بركان / Berkane</option>
      </select>
    </div>

    <div class="head">
      <div>
        <h2 id="gameTitle"></h2>
        <p id="gameSub"></p>
      </div>
      <div class="progress" id="progress">01 / 05<div class="bar"><i id="bar"></i></div></div>
    </div>
    <div class="grid">
      <div class="round">
        <div class="gallery" id="gallery">
          <div class="track" id="track"></div>
          <button class="arrow prev" onclick="move(-1)">‹</button>
          <button class="arrow next" onclick="move(1)">›</button>
          <span class="count" id="count">1 / 1</span>
          <div class="photo-zoom">
            <button onclick="zoomPhoto(1)">+</button>
            <button onclick="zoomPhoto(-1)">−</button>
            <button onclick="openFullscreen()">⤢</button>
          </div>
        </div>
        <div class="reveal" id="reveal">
          <div>
            <small id="feedback"></small>
            <h3 id="accuracy"></h3>
            <div class="reveal-grid">
              <div class="reveal-stat"><b id="yourGuess"></b><small id="yourLabel"></small></div>
              <div class="reveal-stat"><b id="actual"></b><small id="actualLabel"></small></div>
              <div class="reveal-stat"><b id="points"></b><small id="pointsLabel"></small></div>
            </div>
            <button class="btn next-btn" id="nextBtn" onclick="nextRound()"></button>
          </div>
        </div>
        <div class="final" id="final">
          <div class="eyebrow" id="complete"></div>
          <h3 id="scoreTitle"></h3>
          <div class="score" id="score"></div>
          <div class="rank" id="playerRank"></div>
          <div class="links" id="links"></div>
          <div class="add-name">
            <input class="name-input" id="playerName">
            <button class="btn" id="addButton" onclick="addPlayer()"></button>
          </div>
          <button class="btn" id="again" onclick="restart()"></button>
        </div>
        <div class="details" id="details">
          <div class="chips" id="chips"></div>
          <div class="input">
            <input id="guess" type="number">
            <button class="btn guess" id="guessBtn" onclick="submit()"></button>
          </div>
        </div>
      </div>
      <aside class="map">
        <div class="map-head">
          <h3 id="mapTitle"></h3>
          <p id="mapSub"></p>
        </div>
        <div class="map-body">
          <div id="map"></div>
          <div class="zoom">
            <button onclick="zoom(1)">+</button>
            <button onclick="zoom(-1)">−</button>
          </div>
        </div>
      </aside>
    </div>
    <div class="leaders">
      <h3 id="leadersTitle"></h3>
      <div class="leader-grid" id="leaderGrid"></div>
      <div style="text-align:center;margin-top:16px">
        <button class="btn" id="exportBtn" onclick="exportLeadersTxt()" style="background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 14px;font-size:12px"></button>
      </div>
    </div>
  </section>
</main>

<div class="fs-modal" id="fsModal">
  <button class="fs-close" onclick="closeFullscreen()">✕</button>

</div>

  ar:{e:'تحدي إيجار العقارات بالمغرب',t:'هل تستطيع تخمين الإيجار؟',i:'شاهد الشقة، وخمّن إيجارها الشهري بالدرهم.',s:'ابدأ التخمين',c:'مدن للاستكشاف',l:'إعلان مسجّل',sec:'50:00',pr:'لكل جولة',gt:'تحدي من خمس جولات',gs:'لا تحتاج إلى حساب - جرّب أفضل تخمين لديك.',mt:'استكشف الحي',ms:'استخدم أزرار + و − فقط.',ld:'متصدرو هذا الأسبوع',g:'أدخل تخمينك بالدرهم',lk:'أكّد التخمين',n:'الجولة التالية',yg:'تخمينك',ac:'الإيجار الحقيقي',pt:' النقاط المكتسبة',co:'اكتمل الدورت',st:'نتيجتك في تخمين الإيجار',rk:'ترتيبك هذا الأسبوع',so:'عرض الإعلان الأصلي',nm:'ادخل اسمك',ad:'أضفني إلى الترتيب',ag:'العب مجدداً',gr:'تخمين رائع!',gd:'حسناً، تخمين جيد!',kp:'حاول في الجولة التالية!',exp:'تحميل الترتيب (.txt)',hi:'شقة متميزة | المغرب',hp:'???? د.م. / الشهر'},

let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, type, duration, vol = 0.1) {
  try {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function soundGuess() {
  playTone(587.33, 'triangle', 0.12, 0.08);
  setTimeout(() => playTone(880, 'sine', 0.18, 0.1), 100);

}
function soundFinal(totalScore) {

    playTone(523.25, 'triangle', 0.2, 0.1);

async function loadListings() {
  try {
    const res = await fetch('./listings.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      allListings = (Array.isArray(data) && data.length > 0) ? data : FALLBACK_LISTINGS;
    } else {
      allListings = FALLBACK_LISTINGS;
    }
  } catch (e) {
    allListings = FALLBACK_LISTINGS;
  }

  allListings = allListings
    .map((item, idx) => {
      let numericPrice = item.price;
      if (!numericPrice && item.priceMAD) {
        numericPrice = parseInt(String(item.priceMAD).replace(/[^\d]/g, ''), 10) || 5000;
      }
      let lat = item.lat || 33.5731;
      let lng = item.lng || -7.5898;

      let pics = [];
      if (Array.isArray(item.images) && item.images.length > 0) {
        pics = item.images.filter(img => typeof img === 'string' && img.trim() !== '');
      } else if (typeof item.images === 'string' && item.images.trim() !== '') {
        try {
          pics = JSON.parse(item.images);
        } catch(e) {
          pics = item.images.split(',').map(s => s.trim()).filter(Boolean);
        }
      }
      if (pics.length === 0 && item.imageUrl) {
        pics = [item.imageUrl];
      }
      if (pics.length === 0) {
        pics = ["https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1200&q=80"];
      }

      return {
        id: item.id || `dar_${idx}`,
        title: item.title || 'إعلان عقاري في المغرب',
        city: item.city || 'Casablanca',
        type: item.type || 'Appartement',
        area: item.area || '—',
        bedrooms: item.bedrooms !== undefined ? item.bedrooms : '—',
        bathrooms: item.bathrooms !== undefined ? item.bathrooms : '—',
        priceMAD: item.priceMAD || String(numericPrice),
        price: numericPrice,
        lat: lat,
        lng: lng,
        url: item.sourceUrl || "https://www.mubawab.ma",
        pics: pics
      };
    });

  if (allListings.length === 0) {
    allListings = FALLBACK_LISTINGS;
  }

  if($('listingCountDisplay')) $('listingCountDisplay').textContent = allListings.length + '+';
  selectRandomRounds();
  render();
}

function setCityFilter(city) {
  selectedCity = city;
  restart();
}

function selectRandomRounds() {
  let seen = getSeenIds();
  let pool = allListings;
  
  if (selectedCity !== 'all') {
    const target = selectedCity.toLowerCase();
    pool = allListings.filter(h => (h.city || '').toLowerCase() === target);
  }

  if (pool.length === 0) {
    pool = allListings;
  }
  
  let available = pool.filter(h => !seen.includes(h.id));
  if (available.length === 0) { available = [...pool]; }
  const shuffled = [...available].sort(() => Math.random() - 0.5);
  activeHomes = shuffled.slice(0, Math.min(5, shuffled.length));
  saveSeenIds([...seen, ...activeHomes.map(h => h.id)]);
}

// jsonbin.io accepts either a Master Key (header X-Master-Key) or a scoped
// Access Key (header X-Access-Key) - they are NOT interchangeable on the same
// header. Since we can't tell which kind of key was pasted in, try Master Key
// first and, if that's rejected, retry once as an Access Key. Any failure is
// logged to the console with the real HTTP status/body so it's diagnosable -
// open DevTools > Console (and Network, filtering for "jsonbin") to see it.
async function jsonbinRequest(url, options = {}) {
  const baseHeaders = { ...(options.headers || {}) };
  const headerVariants = [
    { 'X-Master-Key': JSONBIN_API_KEY },
    { 'X-Access-Key': JSONBIN_API_KEY }
  ];
  let lastErr;
  for (const authHeader of headerVariants) {
    try {
      const res = await fetch(url, { ...options, headers: { ...baseHeaders, ...authHeader } });
      if (res.ok) return res;
      const bodyText = await res.text().catch(() => '');
      lastErr = new Error(`jsonbin.io ${res.status} ${res.statusText} using ${Object.keys(authHeader)[0]} — ${bodyText}`);
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr;
}

async function getLeaders() {
  if (!JSONBIN_ENABLED) {
    try {
      const saved = localStorage.getItem('darguessr_leaders_cache');
      cachedLeaders = saved ? JSON.parse(saved) : DEFAULT_LEADERS;
    } catch (e) {
      cachedLeaders = DEFAULT_LEADERS;
    }
    return cachedLeaders;
  }
  try {
    const res = await jsonbinRequest(`${JSONBIN_BASE}/latest`, {
      headers: { 'X-Bin-Meta': 'false' },
      cache: 'no-store'
    });
    const data = await res.json();
    cachedLeaders = (Array.isArray(data) && data.length > 0) ? data : DEFAULT_LEADERS;
    try { localStorage.setItem('darguessr_leaders_cache', JSON.stringify(cachedLeaders)); } catch (e) {}
  } catch (e) {
    console.error('[DarGuessr/jsonbin] Could not read the leaderboard, showing last known / default instead:', e.message || e);
    try {
      const saved = localStorage.getItem('darguessr_leaders_cache');
      cachedLeaders = saved ? JSON.parse(saved) : DEFAULT_LEADERS;
    } catch (e2) {
      cachedLeaders = DEFAULT_LEADERS;
    }
  }
  return cachedLeaders;
}

async function saveLeaders(leaders) {
  cachedLeaders = leaders;
  try { localStorage.setItem('darguessr_leaders_cache', JSON.stringify(leaders)); } catch (e) {}
  if (!JSONBIN_ENABLED) return;
  try {
    await jsonbinRequest(JSONBIN_BASE, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(leaders)
    });
  } catch (e) {
    console.error('[DarGuessr/jsonbin] Could not write the leaderboard:', e.message || e);
    throw e;
  }
}

async function updateLeaderboardUI() {
  $('leaderGrid').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--muted);font-family:'DM Sans'">${L === 'ar' ? '...جارٍ التحميل' : 'Loading...'}</div>`;
  const list = await getLeaders();
  $('leaderGrid').innerHTML = list.map((x, i) => 
    `<div class="leader">${String(i + 1).padStart(2, '0')} · <span class="leader-name" dir="ltr">${x[0]}</span> <b>${fmt(x[1])}</b></div>`
  ).join('');
}

function exportLeadersTxt() {
  const list = cachedLeaders.length ? cachedLeaders : DEFAULT_LEADERS;
  const textContent = list.map((x, i) => `${String(i + 1).padStart(2, '0')}. ${x[0]} - ${x[1]} pts`).join('\r\n');
  const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'darguessr_rankings.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function addPlayer() {
  const n = $('playerName').value.trim();
  if (!n) return $('playerName').focus();
  $('playerName').disabled = true;
  $('addButton').disabled = true;
  const originalLabel = $('addButton').textContent;
  $('addButton').textContent = L === 'ar' ? '...جارٍ الحفظ' : 'Saving...';
  try {
    let list = await getLeaders(); // re-fetch the shared list right before writing, so we merge with
                                    // whatever other players have already added instead of overwriting them
    list.push([n, score]);
    list.sort((a, b) => b[1] - a[1]);
    list = list.slice(0, 10);
    await saveLeaders(list);
    await updateLeaderboardUI();
    $('addButton').textContent = originalLabel;
  } catch (e) {
    console.error(e);
    alert(L === 'ar' ? 'تعذّر حفظ نتيجتك في الترتيب، تحقق من اتصالك وحاول مرة أخرى.' : "Couldn't save your score to the leaderboard - check your connection and try again.");
    $('playerName').disabled = false;
    $('addButton').disabled = false;
    $('addButton').textContent = originalLabel;
  }
}

function placeMap(h) {
  if (!mapInst) {
    mapInst = window.L.map('map', { zoomControl: false, attributionControl: true }).setView([h.lat, h.lng], 14);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(mapInst);
    marker = window.L.circleMarker([h.lat, h.lng], { radius: 9, weight: 3, color: '#fff', fillColor: '#ff725e', fillOpacity: 1 }).addTo(mapInst);
  } else {
    mapInst.setView([h.lat, h.lng], 14);
    marker.setLatLng([h.lat, h.lng]);
    setTimeout(() => mapInst.invalidateSize(), 150);
  }
}

function zoom(n) {
  z = Math.max(-3, Math.min(5, z + n));
  if (mapInst) mapInst.setZoom(14 + z);
}

function zoomPhoto(n) {
  photoZoom = Math.max(1, Math.min(3, photoZoom + (n * 0.5)));
  if (photoZoom === 1) {
    panX = 0;
    panY = 0;
  }
  updatePhotoZoomScale();
}

function updatePhotoZoomScale() {
  document.querySelectorAll('.slide-inner').forEach(el => {
    el.style.transform = `scale(${photoZoom}) translate(${panX}px, ${panY}px)`;
    el.style.cursor = photoZoom > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default';
  });
}

function resetPhotoTransform() {
  photoZoom = 1;
  panX = 0;
  panY = 0;
  isDragging = false;
  updatePhotoZoomScale();
}

function move(n) {
  const h = activeHomes[r];
  const total = (h && h.pics && h.pics.length > 0) ? h.pics.length : 1;
  p = (p + n + total) % total;
  $('track').style.transform = `translateX(-${p * 100}%)`;
  $('count').textContent = `${p + 1} / ${total}`;
  resetPhotoTransform();
  if ($('fsModal').style.display === 'flex') {
    updateFsImage();
  }
}

const galleryEl = $('gallery');

galleryEl.addEventListener('mousedown', (e) => {
  if (photoZoom <= 1) return;
  isDragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  updatePhotoZoomScale();
  e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging || photoZoom <= 1) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  updatePhotoZoomScale();
});

window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    updatePhotoZoomScale();
  }
});

galleryEl.addEventListener('touchstart', (e) => {
  if (photoZoom <= 1) return;
  if (e.touches.length === 1) {
    isDragging = true;
    startX = e.touches[0].clientX - panX;
    startY = e.touches[0].clientY - panY;
    updatePhotoZoomScale();
  }
}, {passive: true});

window.addEventListener('touchmove', (e) => {
  if (!isDragging || photoZoom <= 1 || e.touches.length !== 1) return;
  panX = e.touches[0].clientX - startX;
  panY = e.touches[0].clientY - startY;
  updatePhotoZoomScale();
}, {passive: true});

window.addEventListener('touchend', () => {
  if (isDragging) {
    isDragging = false;
    updatePhotoZoomScale();
  }
});

function formatTimerDisplay(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

function startTimer() {
  clearInterval(timerInt);
  timeLeft = 3000;
  if ($('seconds')) $('seconds').textContent = formatTimerDisplay(timeLeft);
  timerInt = setInterval(() => {
    timeLeft--;
    if ($('seconds')) $('seconds').textContent = formatTimerDisplay(timeLeft);
    if (timeLeft <= 10 && timeLeft > 0) {
      soundTick();
    }
    if (timeLeft <= 0) {
      clearInterval(timerInt);
      submit();
    }
  }, 1000);
}

function stopTimer() { clearInterval(timerInt); }

function render() {
  if (!activeHomes || activeHomes.length === 0) return;
  const h = activeHomes[r];
  $('gallery').style.display = 'block';
  $('reveal').style.display = 'none';
  $('final').style.display = 'none';
  $('details').style.display = 'block';
  
  const bedLabel = L === 'ar' ? 'غرف النوم' : 'Beds';
  const bathLabel = L === 'ar' ? 'الحمامات' : 'Baths';
  
  $('chips').innerHTML = [
    `📍 ${h.city}`,
    `🏠 ${h.type}`,
    (h.area && h.area !== '—') ? `📐 ${h.area} m²` : '',
    (h.bedrooms && h.bedrooms !== '—') ? `🛏️ ${h.bedrooms} ${bedLabel}` : '',
    (h.bathrooms && h.bathrooms !== '—') ? `🛁 ${h.bathrooms} ${bathLabel}` : '',
    L === 'ar' ? 'إعلان حقيقي' : 'Real Listing'
  ].filter(Boolean).map(x => `<span class="chip">${x}</span>`).join('');
  
  const track = $('track');
  track.innerHTML = h.pics.map(pic => {
    const photoUrl = (pic.startsWith('http') || pic.startsWith('data:')) ? pic : `https://images.unsplash.com/photo-${pic}?auto=format&fit=crop&w=1200&q=80`;
    return `<div class="slide"><div class="slide-inner" style="background-image: url('${photoUrl}');"></div></div>`;
  }).join('');

  const totalPics = h.pics.length;
  const hasMultiple = totalPics > 1;
  document.querySelectorAll('.gallery .arrow').forEach(el => el.style.display = hasMultiple ? 'block' : 'none');
  
  z = 0;
  resetPhotoTransform();
  placeMap(h);
  $('guess').value = '';
  $('guess').placeholder = t().g;
  p = 0;
  move(0);
  $('progress').childNodes[0].nodeValue = `${r + 1} / 05`;
  $('bar').style.width = `${(r + 1) * 20}%`;
  
  startTimer();
}

function submit() {
  stopTimer();
  soundGuess();
  const val = +$('guess').value;
  const g = val > 0 ? val : 0;
  const a = activeHomes[r].price, pt = Math.max(0, Math.round(100 - Math.abs(g - a) / a * 100));
  score += pt;
  $('gallery').style.display = 'none';
  $('reveal').style.display = 'flex';
  $('reveal').className = 'reveal ' + (pt >= 85 ? '' : pt >= 55 ? 'yellow' : 'red');
  $('feedback').textContent = pt >= 85 ? t().gr : pt >= 55 ? t().gd : t().kp;
  $('accuracy').textContent = fmt(pt) + '%';
  $('yourGuess').textContent = fmt(g) + ' ' + (L === 'ar' ? 'درهم' : 'MAD');
  $('actual').textContent = fmt(a) + ' ' + (L === 'ar' ? 'درهم' : 'MAD');
  $('points').textContent = '+' + fmt(pt);
  $('nextBtn').textContent = r === 4 ? (L === 'ar' ? 'عرض النتائج' : 'See results') : t().n;
}

function nextRound() {
  if (++r < 5) return render();
  stopTimer();
  soundFinal(score);
  $('reveal').style.display = 'none';
  $('details').style.display = 'none';
  $('final').style.display = 'block';
  $('score').textContent = fmt(score) + ' / 500';
  $('playerRank').textContent = t().rk + ': ' + (score >= 425 ? 'Top 2%' : score >= 300 ? 'Top 12%' : 'Top 35%');
  $('links').innerHTML = activeHomes.map((h) => `<a href="${h.url}" target="_blank" rel="noopener noreferrer">${h.title} — ${t().so}</a>`).join('');
  $('playerName').placeholder = t().nm;
  $('addButton').textContent = t().ad;
}

function restart() {
  r = 0;
  score = 0;
  selectRandomRounds();
  $('playerName').value = '';
  $('playerName').disabled = false;
  $('addButton').disabled = false;
  render();
}

function setLang(n) {
  L = n;
  document.documentElement.lang = n;
  document.body.dir = n === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('en', n === 'en');
  $('arBtn').classList.toggle('on', n === 'ar');
  $('enBtn').classList.toggle('on', n === 'en');
  const b = { eyebrow: 'e', title: 't', intro: 'i', start: 's', city: 'c', listing: 'l', seconds: 'sec', perRound: 'pr', gameTitle: 'gt', gameSub: 'gs', mapTitle: 'mt', mapSub: 'ms', leadersTitle: 'ld', guessBtn: 'lk', yourLabel: 'yg', actualLabel: 'ac', pointsLabel: 'pt', complete: 'co', scoreTitle: 'st', again: 'ag', exportBtn: 'exp', heroInfo: 'hi', heroPrice: 'hp' };
  Object.entries(b).forEach(([id, k]) => { if ($(id)) $(id).textContent = t()[k]; });
  render();
  updateLeaderboardUI();
}

// KEYBOARD NAVIGATION (Right arrow for next, Left arrow for previous)
window.addEventListener('keydown', (e) => {
  const activeEl = document.activeElement;
  const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');

  if (e.key === 'Escape') {
    if ($('fsModal').style.display === 'flex') {
      closeFullscreen();
      e.preventDefault();
    }
  }

  if (isInput) return;

  if (e.key === 'ArrowRight') {
    move(1);
    e.preventDefault();
  } else if (e.key === 'ArrowLeft') {
    move(-1);
    e.preventDefault();
  }
});

$('guess').addEventListener('keyup', (e) => {
  if (e.key === 'Enter') submit();
});

loadListings();
setLang('ar');
</script>
